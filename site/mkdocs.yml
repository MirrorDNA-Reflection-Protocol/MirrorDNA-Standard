site_name: MirrorDNA Ecosystem Documentation
site_description: Comprehensive documentation for MirrorDNA Standard, LingOS, ActiveMirrorOS, and the reflective AI ecosystem
site_author: MirrorDNA Reflection Protocol
repo_url: https://github.com/MirrorDNA-Reflection-Protocol/MirrorDNA-Standard
repo_name: MirrorDNA-Standard

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Ecosystem:
      - Overview: ecosystem-overview.md
      - Why MirrorDNA?: why-mirrordna.md
      - Roadmap: roadmap.md
  - Core Standard:
      - MirrorDNA Standard: mirrordna-standard.md
      - Principles: principles.md
      - Compliance Levels: compliance-levels.md
      - Glossary: glossary.md
  - Products & Platforms:
      - LingOS: lingos.md
      - ActiveMirrorOS: activemirroros.md
  - Trust & Security:
      - Trust by Design: trust-by-design.md
      - AgentDNA: agentdna.md
      - Glyphtrail: glyphtrail.md
      - Vault Manager: vault-manager.md
      - Vault Integrity: vault-integrity.md
  - Developer Guide:
      - Quick Start: quickstart.md
      - Integration Guide: integration.md
      - Examples: examples.md
      - Validators: validators.md
  - Reference:
      - FAQ: faq.md
      - Architecture: architecture.md
      - Contributing: contributing.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MirrorDNA-Reflection-Protocol
  generator: false

copyright: Copyright &copy; 2025 MirrorDNA Reflection Protocol
